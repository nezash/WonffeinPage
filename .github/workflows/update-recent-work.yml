# Cada 6 horas (y a mano desde la pestaña Actions) actualiza la tira "Made for lovely clients"
# con las 4 comisiones más nuevas del portafolio de Won en VGen.
name: Actualizar comisiones recientes

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Traer comisiones de VGen
        run: python scripts/update-recent-work.py
      - name: Guardar cambios si los hay
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A assets/recent js/recent-work-data.js
          git diff --cached --quiet || (git commit -m "Actualizar comisiones recientes de VGen" && git push)
